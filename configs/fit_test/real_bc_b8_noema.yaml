base_config: pi_modified_real_bc
exp_name: fit_test
project_name: LeHome
init_checkpoint: outputs/checkpoints/lehome_sim/params
lr_schedule:
  warmup_steps: 100000
  peak_lr: 0.0001
  decay_steps: 300000
  decay_lr: 1.0e-05
optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-08
  weight_decay: 1.0e-10
  aux_head_weight_decay: 0.001
  clip_gradient_norm: 1.0
num_train_steps: 12
batch_size: 8
ema_decay: null
num_flow_samples: 5
num_workers: 8
save_interval: 100000
keep_period: null
assets_base_dir: ./outputs/assets
checkpoint_base_dir: /tmp/claude-1001/-home-erkkalehtonen-codeprojects-LEHOME/8bf15c58-df44-47be-98e6-fae6bc88295b/scratchpad/fit_ckpt
wandb_enabled: false
hf_model_repo: null
model:
  use_success_head: true
  success_loss_weight: 0.0
  checkpoint_loss_weight: 0.0
  ttc_loss_weight: 0.0
  garment_type_loss_weight: 0.1
  completion_loss_weight: 0.1
  use_keypoint_distance_head: false
  use_wm_fast_head: false
  use_wm_flow_head: false
  use_garment_type_input: true
  use_advantage_embedding: false
  rotate_top_image: false
  train_aug:
    brightness: 0.25
    contrast: 0.3
    saturation: 0.3
    hue: 0.03
    per_camera_color: true
    per_channel_gain: 0.1
    gamma_range: 0.1
    gauss_blur_sigma: 0.8
    gauss_blur_prob: 0.3
    additive_noise_std: 0.012
    top_crop_frac: 0.92
    top_rotate_deg: 3.0
    apply_top_geo_to_all_cameras: true
    zoom_range: 0.05
    translate_px: 10.0
    cutout_prob: 0.3
    cutout_max_area: 0.1
    cam_dropout_prob: 0.05
    state_dropout_prob: 0.05
    state_noise_std: 0.02
    calibration_scale_noise: 0.02
data:
  repo_id: real_bc
  asset_id: real_bc
  use_per_timestamp_norm: true
  raw_real_camera_mapping: true
  use_delta_joint_actions: true
  use_fast_tokenization: true
  use_advantages: false
  success_label_smoothing: 0.0
  pct_real: 0.0
  bucket_shares:
    primary_real: 0.6
    home_real: 0.3
    home_sim: 0.1
  dagger_sampling:
    human_weight: 2.0
    auto_weight: 0.3
    pre_intervention_min_weight: 0.0
    pre_intervention_window_seconds: 5.0
  sim_garment_skip:
    garment_type_name: Pant_Long
    first_n_keep: 10
    skip_until_frac: 0.5
    apply_to_buckets:
    - home_sim
  initial_stuck:
    movement_threshold: 3.0
    position_std_factor: 3.0
    min_position_range: 5.0
    min_leading_frames: 5
    mid_weight: 0.2
    trailing_weight: 0.3
    apply_to_buckets:
    - primary_real
    - home_real
  data_sources:
  - root: data/lehome_real/four_types_merged
    repo_id: primary_real
    is_real: true
    use_for_success_labels: false
    bucket: primary_real
    speed_factor: 1.0
